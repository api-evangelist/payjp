    type: Documentation
  - url: https://docs.pay.jp/v1/api/
    type: APIReference
  - url: openapi/payjp-openapi.yml
    type: OpenAPI
  description: Create, retrieve, list, update, capture, re-authorize, and refund
    one-time and subscription charges in JPY, including two-step (auth/capture) and
    3D Secure (tds_finish) flows.
