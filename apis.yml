aid: payjp
url: https://raw.githubusercontent.com/api-evangelist/payjp/refs/heads/main/apis.yml
name: PAY.JP
kind: company
description: PAY.JP is an online payment service operated by PAY, Inc. (PAY株式会社)
  in Japan. Its Stripe-style REST API lets merchants create charges, tokenize cards,
  manage customers, run subscriptions (定期課金), and settle transfers (入金) in
  Japanese yen, with a Platform API (beta) for marketplace/multi-tenant payouts.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
