  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: PAY, Inc.
serviceCategory: Payments and Financial Services
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Per-transaction and Monthly
  billingCurrency: JPY
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: PAY.JP
  ServiceCategory: Payments and Financial Services
  ProviderName: PAY.JP
  PublisherName: PAY, Inc.
  InvoiceIssuerName: PAY, Inc.
  BillingCurrency: JPY
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: card_processing_fee
  description: Percentage fee on each successful card charge; rate varies by plan and card brand.
  unit: percent_of_amount
  aggregation: sum
  dimensions:
  - account
  - plan
  - card_brand
- name: paypay_processing_fee
  description: Percentage fee on each successful PayPay payment; rate varies by merchant category.
  unit: percent_of_amount
  aggregation: sum
  dimensions:
  - account
  - category
- name: transfer_fee
  description: Fixed 250 JPY fee deducted per payout to the merchant bank account.
  unit: jpy
  aggregation: sum
  dimensions:
  - account
  - payout
- name: monthly_plan_fee
  description: Fixed monthly platform fee on Business (20,000 JPY) and Enterprise (50,000 JPY) plans.
  unit: jpy
  aggregation: sum
  dimensions:
  - account
  - plan
- name: refunded_amount
  description: Principal reversed on refunds (full or partial) via POST /charges/{id}/refund.
  unit: jpy
  aggregation: sum
  dimensions:
  - account
  - charge
principles:
- name: Visibility
  description: Pull statements (取引明細), balances (残高), and transfer details for per-charge fee and payout reconciliation.
- name: Allocation
  description: Tag charges/customers with metadata (up to 20 keys) to map payment volume and fees to internal cost centers.
- name: Optimization
  description: Match plan tier to monthly volume so the step-down card rate offsets the monthly fee; consolidate payouts to reduce fixed transfer fees.
- name: Accountability
  description: Review effective processing-fee percentage and payout fees monthly against payment volume and margin.
