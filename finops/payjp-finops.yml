description: >-
  FinOps view of PAY.JP costs. Unlike metered API platforms, PAY.JP has no per-call
  API charge; cost is driven by payment volume. Merchants pay a percentage
  processing fee (決済手数料) per successful charge, a fixed transfer fee (振込手数料) per
  payout, and, on Business/Enterprise plans, a fixed monthly plan fee. Refunds
  reverse the principal but the processing fee treatment follows PAY.JP policy.
  All billing is in JPY.
notes: >-
  Rates reconciled from https://pay.jp/plan on 2026-07-17. Effective cost per
  transaction depends on the active plan, card brand, and PayPay vs card mix.
sources:
- https://pay.jp/plan
- https://docs.pay.jp/v1/api/
- https://focus.finops.org/focus-specification/v1-3/
