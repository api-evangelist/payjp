generated: '2026-07-17'
method: searched
source: https://docs.pay.jp/v1/api/
format: payjp-error-object
notes: >-
  PAY.JP returns a single top-level `error` object (not RFC 9457
  application/problem+json). Card-specific decline codes are catalogued
  separately in errors/payjp-decline-codes.yml. All codes below are published in
  the PAY.JP API reference.
envelope:
  shape: '{"error": {"type": ..., "code": ..., "message": ..., "status": ..., "param": ...}}'
  fields:
    type: High-level error class (see error_types).
    code: Machine-readable error code (see codes).
    message: Human-readable Japanese message.
    status: Duplicated HTTP status code.
    param: The offending request parameter, when applicable.
error_types:
  - id: client_error
    meaning: Request validation failures.
  - id: card_error
    meaning: Card processing issues.
  - id: auth_error
    meaning: Authentication failures (invalid/missing API key).
  - id: invalid_request_error
    meaning: Invalid request format.
  - id: not_allowed_method_error
    meaning: Unsupported HTTP method.
  - id: server_error
    meaning: PAY.JP or network infrastructure failure.
http_status:
  '200': Success
  '400': Request error (invalid parameters, missing resources)
  '401': Authentication error (invalid API key)
  '402': Card processing error
  '404': Resource not found
  '429': Rate limit exceeded (code over_capacity)
  '500': Server-side failure
