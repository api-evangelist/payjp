source: https://docs.pay.jp/v1/testcard
notes: >-
  PAY.JP separates test and live via key prefix; there is no separate sandbox
  host — the same https://api.pay.jp/v1 endpoint runs in test mode when called
  with a test secret key. All values below are published verbatim in the docs;
  none are invented. Arbitrary cardholder name and other free-text fields may be
  sent in test mode. Test mode rate limit is 2 req/sec across all zones.
modes:
  test:
    secret_key_prefix: sk_test_
    publishable_key_prefix: pk_test_
    note: Charges/tokens created with a test key have livemode=false and never move real money.
  live:
    secret_key_prefix: sk_live_
    publishable_key_prefix: pk_live_
